name: devsecops-project

services:

  app1:
    image: devsecops-app:${APP_VERSION:-manual}
    build:
      context: ./app
    environment:
      INSTANCE_NAME: APP1
    restart: unless-stopped
    networks:
      - devsecops

  app2:
    image: devsecops-app:${APP_VERSION:-manual}
    build:
      context: ./app
    environment:
      INSTANCE_NAME: APP2
    restart: unless-stopped
    networks:
      - devsecops

  nginx:
    image: nginx:alpine
    container_name: devsecops-nginx
    depends_on:
      - app1
      - app2
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    restart: unless-stopped
    networks:
      - devsecops

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: devsecops-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - devsecops

  grafana:
    image: grafana/grafana:13.2.0
    container_name: devsecops-grafana
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - devsecops

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: devsecops-node-exporter
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    networks:
      - devsecops

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5    
    container_name: devsecops-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped
    networks:
      - devsecops

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.4
    container_name: devsecops-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - devsecops

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.4
    container_name: devsecops-kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    restart: unless-stopped
    networks:
      - devsecops

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.3.4
    container_name: devsecops-filebeat
    user: root
    depends_on:
      - elasticsearch
      - kibana
    command:
      - filebeat
      - -e
      - --strict.perms=false
    volumes:
      - ./elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro,Z
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - label=disable
    restart: unless-stopped
    networks:
      - devsecops

  vault:
    image: hashicorp/vault:2.0.3
    container_name: devsecops-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    restart: unless-stopped
    networks:
      - devsecops

volumes:

  prometheus-data:
  grafana-data:
  elasticsearch-data:

networks:

  devsecops:
    driver: bridge

