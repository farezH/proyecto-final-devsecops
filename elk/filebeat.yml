filebeat.inputs:

  - type: filestream
    id: docker-containers

    paths:
      - /var/lib/docker/containers/*/*.log

    parsers:
      - container:
          stream: all
          format: auto

processors:

  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

output.elasticsearch:

  hosts:
    - "http://elasticsearch:9200"

setup.kibana:

  host: "http://kibana:5601"

